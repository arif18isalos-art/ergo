<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1e3a5f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ERGO">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="ERGO">
  <meta name="description" content="Καταγραφή ωρών εργασίας, υπερωριών και αδειών">
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22ERGO%20-%20%CE%9A%CE%B1%CF%84%CE%B1%CE%B3%CF%81%CE%B1%CF%86%CE%AE%20%CE%95%CF%81%CE%B3%CE%B1%CF%83%CE%AF%CE%B1%CF%82%22%2C%22short_name%22%3A%22ERGO%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230f172a%22%2C%22theme_color%22%3A%22%231e3a5f%22%2C%22lang%22%3A%22el%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%20xmlns%3D'http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg'%20viewBox%3D'0%200%20100%20100'%253E%253Crect%20fill%3D'%231e3a5f'%20width%3D'100'%20height%3D'100'%20rx%3D'22'%2F%253E%253Ctext%20x%3D'50'%20y%3D'68'%20font-size%3D'42'%20font-weight%3D'700'%20text-anchor%3D'middle'%20fill%3D'white'%20font-family%3D'system-ui%2Csans-serif'%253EE%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%22any%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect fill='%231e3a5f' width='100' height='100' rx='22'/%3E%3Ctext x='50' y='68' font-size='42' font-weight='700' text-anchor='middle' fill='white' font-family='system-ui,sans-serif'%3EE%3C/text%3E%3C/svg%3E">
  <title>ERGO</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --card-hover: #334155; --primary: #3b82f6;
      --success: #22c55e; --warning: #f59e0b; --danger: #ef4444; --purple: #a855f7;
      --text: #f1f5f9; --text-muted: #94a3b8; --border: #334155; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.5; padding-bottom: 80px;
    }
    header {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      padding: 20px 16px 16px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 1.3rem; font-weight: 700; text-align: center; }
    header .date { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; }
    .screen { display: none; padding: 20px 16px; max-width: 480px; margin: 0 auto; animation: fadeIn 0.25s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .btn-grid { display: grid; gap: 14px; }
    .btn {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 18px 20px; border: none;
      border-radius: var(--radius); font-size: 1.05rem; font-weight: 600; color: white; cursor: pointer;
      transition: transform 0.15s, opacity 0.15s; text-align: left; box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn .icon { font-size: 1.6rem; flex-shrink: 0; width: 36px; text-align: center; }
    .btn .label { flex: 1; }
    .btn .sub { display: block; font-size: 0.8rem; font-weight: 400; opacity: 0.85; margin-top: 2px; }
    .btn-work { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .btn-overtime { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .btn-note { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .btn-leave { background: linear-gradient(135deg, #a855f7, #9333ea); }
    .btn-sick { background: linear-gradient(135deg, #ef4444, #dc2626); }
    nav {
      position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border);
      display: flex; justify-content: center; padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); z-index: 100;
    }
    nav button {
      flex: 1; max-width: 160px; background: none; border: none; color: var(--text-muted); font-size: 0.8rem;
      font-weight: 600; padding: 10px 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    nav button.active { color: var(--primary); }
    nav button .nav-icon { font-size: 1.35rem; }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: flex-end;
      justify-content: center; z-index: 200; padding: 16px;
    }
    .modal-overlay.show { display: flex; animation: fadeIn 0.2s ease; }
    .modal {
      background: var(--card); border-radius: 20px 20px 16px 16px; width: 100%; max-width: 400px;
      padding: 24px 20px 20px; max-height: 80vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.2rem; margin-bottom: 16px; text-align: center; }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .modal-actions button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: var(--border); color: var(--text); }
    .btn-save { background: var(--primary); color: white; }
    .hours-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .hours-grid button {
      padding: 16px 0; border: 2px solid var(--border); background: var(--bg); color: var(--text);
      border-radius: 12px; font-size: 1.1rem; font-weight: 600; cursor: pointer;
    }
    .hours-grid button.selected { border-color: var(--primary); background: var(--primary); color: white; }
    textarea {
      width: 100%; min-height: 120px; padding: 14px; border: 2px solid var(--border); border-radius: 12px;
      background: var(--bg); color: var(--text); font-size: 1rem; font-family: inherit; resize: vertical;
    }
    textarea:focus { outline: none; border-color: var(--primary); }
    .month-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 8px; }
    .month-nav button {
      background: var(--card); border: 1px solid var(--border); color: var(--text); width: 44px; height: 44px;
      border-radius: 12px; font-size: 1.3rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .month-nav .month-title { flex: 1; text-align: center; font-size: 1.15rem; font-weight: 700; }
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .summary-card { background: var(--card); border-radius: var(--radius); padding: 16px; text-align: center; }
    .summary-card .value { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
    .summary-card .label { font-size: 0.8rem; color: var(--text-muted); }
    .summary-card.green .value { color: #4ade80; }
    .summary-card.blue .value { color: #60a5fa; }
    .summary-card.purple .value { color: #c084fc; }
    .summary-card.red .value { color: #f87171; }
    .summary-card.orange .value { color: #fbbf24; }
    .summary-card.full { grid-column: 1 / -1; }
    .payment-section {
      background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 24px;
    }
    .payment-section .section-label {
      font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 12px;
      text-transform: uppercase; letter-spacing: 0.04em;
    }
    .payment-row {
      display: flex; align-items: center; justify-content: space-between; padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .payment-row:last-child { border-bottom: none; padding-bottom: 0; }
    .payment-row:first-of-type { padding-top: 0; }
    .payment-info { display: flex; flex-direction: column; gap: 2px; }
    .payment-info .title { font-weight: 600; font-size: 0.95rem; }
    .payment-info .status { font-size: 0.8rem; }
    .payment-info .status.paid { color: #4ade80; }
    .payment-info .status.unpaid { color: #f87171; }
    .toggle-btn {
      border: none; border-radius: 20px; padding: 8px 14px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; min-width: 100px;
    }
    .toggle-btn.paid { background: rgba(34,197,94,0.2); color: #4ade80; }
    .toggle-btn.unpaid { background: rgba(239,68,68,0.15); color: #f87171; }
    .day-list { display: flex; flex-direction: column; gap: 8px; }
    .day-item {
      background: var(--card); border-radius: 12px; padding: 14px 16px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
    }
    .day-item:active { background: var(--card-hover); }
    .day-item .day-date { font-weight: 600; font-size: 0.95rem; }
    .day-item .day-info { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }
    .day-item .day-right { text-align: right; font-size: 0.85rem; color: var(--text-muted); }
    .section-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
    .detail-card { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
    .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .label { color: var(--text-muted); font-size: 0.95rem; }
    .detail-row .value { font-weight: 600; text-align: right; max-width: 60%; word-break: break-word; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-leave { background: rgba(168,85,247,0.2); color: #c084fc; }
    .badge-sick { background: rgba(239,68,68,0.2); color: #f87171; }
    .badge-none { background: rgba(148,163,184,0.2); color: #94a3b8; }
    .back-btn { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; color: var(--primary); font-size: 1rem; font-weight: 600; cursor: pointer; margin-bottom: 16px; padding: 4px 0; }
    .btn-delete { width: 100%; margin-top: 12px; padding: 14px; background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
    .toast {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--success);
      color: white; padding: 14px 24px; border-radius: 12px; font-weight: 600; z-index: 300;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3); transition: transform 0.3s ease; max-width: 90%; text-align: center;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--danger); }
    .install-banner {
      background: linear-gradient(135deg, #1e40af, #3b82f6); border-radius: var(--radius); padding: 16px;
      margin-bottom: 16px; display: none; align-items: center; gap: 12px;
    }
    .install-banner.show { display: flex; }
    .install-banner .text { flex: 1; font-size: 0.9rem; }
    .install-banner button {
      background: white; color: #1e40af; border: none; padding: 10px 16px; border-radius: 10px;
      font-weight: 700; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <h1 id="header-title">ERGO</h1>
    <div class="date" id="header-date"></div>
  </header>

  <div id="screen-home" class="screen active">
    <div id="install-banner" class="install-banner">
      <div class="text">Προσθήκη στην αρχική οθόνη</div>
      <button onclick="promptInstall()">Προσθήκη</button>
    </div>
    <div class="btn-grid">
      <button class="btn btn-work" onclick="addWorkHours()">
        <span class="icon">✅</span>
        <span class="label">8 Ώρες Εργασίας<span class="sub">Καταχώρηση 8 ωρών για σήμερα</span></span>
      </button>
      <button class="btn btn-overtime" onclick="openOvertimeModal()">
        <span class="icon">⏱️</span>
        <span class="label">Υπερωρία<span class="sub">Επιλογή 1–8 ωρών</span></span>
      </button>
      <button class="btn btn-note" onclick="openNoteModal()">
        <span class="icon">📝</span>
        <span class="label">Προσθήκη Σημείωσης<span class="sub">Σημείωση για σήμερα</span></span>
      </button>
      <button class="btn btn-leave" onclick="addLeave('Άδεια')">
        <span class="icon">🏖️</span>
        <span class="label">Άδεια<span class="sub">Σήμανση ως άδεια</span></span>
      </button>
      <button class="btn btn-sick" onclick="addLeave('Αναρρωτική')">
        <span class="icon">🤒</span>
        <span class="label">Αναρρωτική Άδεια<span class="sub">Σήμανση ως αναρρωτική</span></span>
      </button>
    </div>
  </div>

  <div id="screen-month" class="screen">
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-title" id="month-title">—</div>
      <button onclick="changeMonth(1)">›</button>
    </div>
    <div class="summary-grid" id="summary-grid"></div>

    <div class="payment-section" id="payment-section">
      <div class="section-label">Κατάσταση Πληρωμής</div>
      <div class="payment-row">
        <div class="payment-info">
          <div class="title">Ώρες Εργασίας</div>
          <div class="status" id="work-paid-status">Δεν πληρώθηκε</div>
        </div>
        <button class="toggle-btn unpaid" id="work-paid-btn" onclick="togglePayment('work')">Σήμανση</button>
      </div>
      <div class="payment-row">
        <div class="payment-info">
          <div class="title">Υπερωρίες</div>
          <div class="status" id="ot-paid-status">Δεν πληρώθηκε</div>
        </div>
        <button class="toggle-btn unpaid" id="ot-paid-btn" onclick="togglePayment('overtime')">Σήμανση</button>
      </div>
    </div>

    <div class="section-title" id="days-title">Ημερήσιες Καταγραφές</div>
    <div class="day-list" id="day-list"></div>
  </div>

  <div id="screen-detail" class="screen">
    <button class="back-btn" onclick="showScreen('month')">← Επιστροφή</button>
    <div id="detail-content"></div>
  </div>

  <nav>
    <button id="nav-home" class="active" onclick="showScreen('home')">
      <span class="nav-icon">🏠</span>Αρχική
    </button>
    <button id="nav-month" onclick="showScreen('month')">
      <span class="nav-icon">📅</span>Μηνιαία
    </button>
  </nav>

  <div id="modal-overtime" class="modal-overlay" onclick="closeModal(event, 'modal-overtime')">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Ώρες Υπερωρίας</h2>
      <div class="hours-grid" id="hours-grid"></div>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal(null, 'modal-overtime')">Ακύρωση</button>
        <button class="btn-save" onclick="saveOvertime()">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <div id="modal-note" class="modal-overlay" onclick="closeModal(event, 'modal-note')">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Προσθήκη Σημείωσης</h2>
      <textarea id="note-input" placeholder="Γράψτε τη σημείωσή σας για σήμερα..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal(null, 'modal-note')">Ακύρωση</button>
        <button class="btn-save" onclick="saveNote()">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const STORAGE_KEY = 'isKayitlari_v1';
    const PAYMENT_KEY = 'isKayitlari_payments_v1';
    const MONTH_NAMES = ['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];
    const MONTH_SHORT = ['Ιαν','Φεβ','Μαρ','Απρ','Μάι','Ιούν','Ιούλ','Αύγ','Σεπ','Οκτ','Νοέ','Δεκ'];
    let currentMonth = (() => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); })();
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('install-banner').classList.add('show');
    });

    function promptInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(() => { deferredPrompt = null; document.getElementById('install-banner').classList.remove('show'); });
      } else {
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        showToast(isIOS ? 'Πατήστε Κοινή χρήση → Προσθήκη στην Αρχική οθόνη' : 'Μενού προγράμματος περιήγησης → Προσθήκη στην αρχική οθόνη');
      }
    }

    function getRecords() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; } }
    function saveRecords(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function getPayments() { try { return JSON.parse(localStorage.getItem(PAYMENT_KEY)) || {}; } catch { return {}; } }
    function savePayments(data) { localStorage.setItem(PAYMENT_KEY, JSON.stringify(data)); }

    function getMonthPayment(yearMonth) {
      const payments = getPayments();
      if (!payments[yearMonth]) payments[yearMonth] = { workPaid: false, overtimePaid: false };
      return payments[yearMonth];
    }

    function todayKey() { return new Date().toISOString().slice(0, 10); }
    function formatDateTR(iso) { const [y, m, d] = iso.split('-'); return d + '/' + m + '/' + y; }
    function formatDayShort(iso) {
      const [y, m, d] = iso.split('-');
      const date = new Date(y, m - 1, d);
      const gun = date.toLocaleDateString('el-GR', { weekday: 'short' });
      return d + ' ' + MONTH_SHORT[m - 1] + ' · ' + gun;
    }
    function getOrCreateToday() {
      const records = getRecords();
      const key = todayKey();
      if (!records[key]) records[key] = { date: key, workHours: 0, overtime: 0, notes: '', leave: null };
      return { records, key, today: records[key] };
    }
    function showToast(msg, isError) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => t.classList.remove('show'), 2800);
    }
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + name).classList.add('active');
      document.getElementById('nav-home').classList.toggle('active', name === 'home');
      document.getElementById('nav-month').classList.toggle('active', name === 'month' || name === 'detail');
      if (name === 'home') {
        document.getElementById('header-title').textContent = 'ERGO';
        updateHeaderDate();
      } else if (name === 'month') {
        document.getElementById('header-title').textContent = 'Μηνιαία Σύνοψη';
        document.getElementById('header-date').textContent = '';
        renderMonthSummary();
      }
    }
    function updateHeaderDate() {
      document.getElementById('header-date').textContent =
        new Date().toLocaleDateString('el-GR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    }
    function addWorkHours() {
      const { records, today } = getOrCreateToday();
      today.workHours = 8;
      if (today.leave) today.leave = null;
      saveRecords(records);
      showToast('✅ Καταχωρήθηκαν 8 ώρες εργασίας');
    }
    let selectedOvertime = 0;
    function openOvertimeModal() {
      selectedOvertime = 0;
      const grid = document.getElementById('hours-grid');
      grid.innerHTML = '';
      for (let i = 1; i <= 8; i++) {
        const btn = document.createElement('button');
        btn.textContent = i + 'ω';
        btn.onclick = () => {
          document.querySelectorAll('#hours-grid button').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOvertime = i;
        };
        grid.appendChild(btn);
      }
      document.getElementById('modal-overtime').classList.add('show');
    }
    function saveOvertime() {
      if (!selectedOvertime) { showToast('Επιλέξτε ώρες', true); return; }
      const { records, today } = getOrCreateToday();
      today.overtime = selectedOvertime;
      if (today.leave) today.leave = null;
      saveRecords(records);
      closeModal(null, 'modal-overtime');
      showToast('⏱️ Καταχωρήθηκαν ' + selectedOvertime + ' ώρες υπερωρίας');
    }
    function openNoteModal() {
      const { today } = getOrCreateToday();
      document.getElementById('note-input').value = today.notes || '';
      document.getElementById('modal-note').classList.add('show');
      setTimeout(() => document.getElementById('note-input').focus(), 100);
    }
    function saveNote() {
      const text = document.getElementById('note-input').value.trim();
      const { records, today } = getOrCreateToday();
      today.notes = text;
      saveRecords(records);
      closeModal(null, 'modal-note');
      showToast(text ? '📝 Η σημείωση αποθηκεύτηκε' : 'Η σημείωση διαγράφηκε');
    }
    function addLeave(type) {
      const { records, today } = getOrCreateToday();
      today.leave = type;
      today.workHours = 0;
      today.overtime = 0;
      saveRecords(records);
      showToast(type === 'Άδεια' ? '🏖️ Καταχωρήθηκε άδεια' : '🤒 Καταχωρήθηκε αναρρωτική');
    }
    function closeModal(event, id) {
      if (event && event.target !== document.getElementById(id)) return;
      document.getElementById(id).classList.remove('show');
    }
    function changeMonth(delta) {
      const [y, m] = currentMonth.split('-').map(Number);
      const d = new Date(y, m - 1 + delta, 1);
      currentMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      renderMonthSummary();
    }
    function getMonthRecords(yearMonth) {
      const records = getRecords();
      return Object.keys(records).filter(k => k.startsWith(yearMonth)).sort((a, b) => b.localeCompare(a)).map(k => records[k]);
    }

    function togglePayment(type) {
      const payments = getPayments();
      if (!payments[currentMonth]) payments[currentMonth] = { workPaid: false, overtimePaid: false };
      if (type === 'work') {
        payments[currentMonth].workPaid = !payments[currentMonth].workPaid;
      } else {
        payments[currentMonth].overtimePaid = !payments[currentMonth].overtimePaid;
      }
      savePayments(payments);
      updatePaymentUI();
      const status = type === 'work'
        ? (payments[currentMonth].workPaid ? 'Ώρες εργασίας: Πληρώθηκε' : 'Ώρες εργασίας: Δεν πληρώθηκε')
        : (payments[currentMonth].overtimePaid ? 'Υπερωρίες: Πληρώθηκαν' : 'Υπερωρίες: Δεν πληρώθηκαν');
      showToast(status);
    }

    function updatePaymentUI() {
      const p = getMonthPayment(currentMonth);
      const workStatus = document.getElementById('work-paid-status');
      const workBtn = document.getElementById('work-paid-btn');
      const otStatus = document.getElementById('ot-paid-status');
      const otBtn = document.getElementById('ot-paid-btn');

      if (p.workPaid) {
        workStatus.textContent = '✅ Πληρώθηκε';
        workStatus.className = 'status paid';
        workBtn.textContent = 'Πληρώθηκε';
        workBtn.className = 'toggle-btn paid';
      } else {
        workStatus.textContent = '❌ Δεν πληρώθηκε';
        workStatus.className = 'status unpaid';
        workBtn.textContent = 'Σήμανση';
        workBtn.className = 'toggle-btn unpaid';
      }

      if (p.overtimePaid) {
        otStatus.textContent = '✅ Πληρώθηκε';
        otStatus.className = 'status paid';
        otBtn.textContent = 'Πληρώθηκε';
        otBtn.className = 'toggle-btn paid';
      } else {
        otStatus.textContent = '❌ Δεν πληρώθηκε';
        otStatus.className = 'status unpaid';
        otBtn.textContent = 'Σήμανση';
        otBtn.className = 'toggle-btn unpaid';
      }
    }

    function renderMonthSummary() {
      const [y, m] = currentMonth.split('-').map(Number);
      document.getElementById('month-title').textContent = MONTH_NAMES[m - 1] + ' ' + y;
      const days = getMonthRecords(currentMonth);
      let totalWork = 0, totalOT = 0, leaveDays = 0, sickDays = 0, workDays = 0;
      days.forEach(r => {
        totalWork += r.workHours || 0;
        totalOT += r.overtime || 0;
        if (r.leave === 'Άδεια') leaveDays++;
        else if (r.leave === 'Αναρρωτική') sickDays++;
        else if (r.workHours > 0 || r.overtime > 0) workDays++;
      });
      const totalHours = totalWork + totalOT;
      document.getElementById('summary-grid').innerHTML =
        '<div class="summary-card green"><div class="value">' + totalWork + '</div><div class="label">Ώρες Εργασίας</div></div>' +
        '<div class="summary-card blue"><div class="value">' + totalOT + '</div><div class="label">Υπερωρίες</div></div>' +
        '<div class="summary-card orange full"><div class="value">' + totalHours + ' ώρες</div><div class="label">Σύνολο (Εργασία + Υπερωρία)</div></div>' +
        '<div class="summary-card"><div class="value">' + workDays + '</div><div class="label">Ημέρες Εργασίας</div></div>' +
        '<div class="summary-card purple"><div class="value">' + leaveDays + '</div><div class="label">Ημέρες Άδειας</div></div>' +
        '<div class="summary-card red"><div class="value">' + sickDays + '</div><div class="label">Αναρρωτική</div></div>' +
        '<div class="summary-card"><div class="value">' + days.length + '</div><div class="label">Καταχωρημένες Ημέρες</div></div>';

      updatePaymentUI();

      const list = document.getElementById('day-list');
      const title = document.getElementById('days-title');
      if (days.length === 0) {
        title.textContent = 'Ημερήσιες Καταγραφές';
        list.innerHTML = '<div class="empty-state"><div class="icon">📭</div><div>Δεν υπάρχουν καταγραφές αυτόν τον μήνα</div></div>';
        return;
      }
      title.textContent = 'Ημερήσιες Καταγραφές (' + days.length + ')';
      list.innerHTML = days.map(r => {
        let info = [], right = '';
        if (r.leave) { info.push(r.leave); right = r.leave === 'Άδεια' ? '🏖️' : '🤒'; }
        else {
          if (r.workHours) info.push(r.workHours + 'ω');
          if (r.overtime) info.push('+' + r.overtime + 'ω υπερωρία');
          if (r.notes) info.push('📝');
          right = ((r.workHours || 0) + (r.overtime || 0) > 0) ? ((r.workHours || 0) + (r.overtime || 0)) + 'ω' : '';
        }
        return '<div class="day-item" onclick="showDetail(\'' + r.date + '\')"><div><div class="day-date">' + formatDayShort(r.date) + '</div><div class="day-info">' + (info.join(' · ') || 'Κενή καταγραφή') + '</div></div><div class="day-right">' + right + '</div></div>';
      }).join('');
    }
    function showDetail(key) {
      const r = getRecords()[key];
      if (!r) return;
      document.getElementById('header-title').textContent = formatDateTR(key);
      document.getElementById('header-date').textContent = '';
      let leaveBadge = '<span class="badge badge-none">Καμία</span>';
      if (r.leave === 'Άδεια') leaveBadge = '<span class="badge badge-leave">🏖️ Άδεια</span>';
      if (r.leave === 'Αναρρωτική') leaveBadge = '<span class="badge badge-sick">🤒 Αναρρωτική</span>';
      document.getElementById('detail-content').innerHTML =
        '<div class="detail-card">' +
        '<div class="detail-row"><span class="label">Ημερομηνία</span><span class="value">' + formatDateTR(key) + '</span></div>' +
        '<div class="detail-row"><span class="label">Ώρες Εργασίας</span><span class="value">' + (r.workHours ? r.workHours + ' ώρες' : '—') + '</span></div>' +
        '<div class="detail-row"><span class="label">Υπερωρία</span><span class="value">' + (r.overtime ? r.overtime + ' ώρες' : '—') + '</span></div>' +
        '<div class="detail-row"><span class="label">Κατάσταση Άδειας</span><span class="value">' + leaveBadge + '</span></div>' +
        '<div class="detail-row"><span class="label">Σημειώσεις</span><span class="value">' + (r.notes || '—') + '</span></div>' +
        '</div><button class="btn-delete" onclick="deleteRecord(\'' + key + '\')">🗑️ Διαγραφή Καταγραφής</button>';
      showScreen('detail');
    }
    function deleteRecord(key) {
      if (!confirm('Θέλετε σίγουρα να διαγράψετε αυτή την καταγραφή;')) return;
      const records = getRecords();
      delete records[key];
      saveRecords(records);
      showToast('Η καταγραφή διαγράφηκε');
      showScreen('month');
    }
    updateHeaderDate();
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.show').forEach(m => m.classList.remove('show'));
    });
    if (window.navigator.standalone !== true && /iPad|iPhone|iPod/.test(navigator.userAgent)) {
      setTimeout(() => {
        if (!window.matchMedia('(display-mode: standalone)').matches) {
          document.getElementById('install-banner').classList.add('show');
        }
      }, 1500);
    }
  </script>
</body>
</html>
